[project]
name = "elshad-ai-python"
version = "0.1.0"
description = "Python runtime packages for sandbox execution, eval graders, and Python SDK"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = [
  "sandbox-runtime/tests",
  "eval-graders/tests",
  "sdk-py/tests",
]
